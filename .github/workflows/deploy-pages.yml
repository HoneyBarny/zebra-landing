name: Deploy site to Cloudflare Pages

# Every push to the working branch or main builds the site and publishes it to
# the production Pages project. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   (Cloudflare API token with Pages: Edit permission)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare account ID)
on:
  push:
    branches:
      - main
      - landing/homepage-positioning-2026-09
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publish dist to production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zebra-landing --branch=main
