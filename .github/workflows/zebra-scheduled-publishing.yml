name: Zebra Scheduled Publishing

on:
  schedule:
    - cron: '0 15 * * 2'
    - cron: '0 15 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish scheduled articles
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run publish:scheduled

      - name: Commit published articles
        run: |
          if git diff --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles package-lock.json package.json
          git commit -m "Publish scheduled Zebra articles"
          git push
