name: Zebra Scheduled Publishing

on:
  # The Tuesday/Friday schedule was removed on 2026-09-12. Search impressions
  # fell from about 1,654 in August to near zero in early September, and no new
  # URL should ship until Search Console explains why (see
  # ZEBRA_GSC_RECOVERY_DATA_REQUEST.md in the parent repo). Publishing is manual
  # only: set an article to status "scheduled" with a past scheduledAt, then run
  # this workflow from the Actions tab. The six crons that ran here were
  # '17 15', '47 15' and '17 16' on days 2 and 5 (UTC).
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLISH_TIME_ZONE: America/Winnipeg

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish scheduled articles
        run: npm run publish:scheduled

      - name: Detect published content changes
        id: changes
        run: |
          if git diff --quiet -- src/content/articles src/data/site-content.ts src/pages/index.astro; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No scheduled publishing changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled publishing changes detected."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.changes.outputs.has_changes == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:pages

      - name: Validate production deployment
        if: steps.changes.outputs.has_changes == 'true'
        env:
          VALIDATION_ATTEMPTS: '9'
          VALIDATION_DELAY_MS: '10000'
        run: npm run publish:scheduled:validate

      - name: Commit published articles
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          if git diff --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles src/data/site-content.ts src/pages/index.astro package-lock.json package.json
          git commit -m "Publish scheduled Zebra articles"
          git push
